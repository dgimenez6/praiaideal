<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>PraiaIdeal - Búzios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-gradient-ok { background: linear-gradient(180deg, #0ea5e9 0%, #0369a1 100%); transition: all 0.5s ease; }
        .bg-gradient-warning { background: linear-gradient(180deg, #f97316 0%, #ea580c 100%); transition: all 0.5s ease; }
        
        .flag-btn { cursor: pointer; opacity: 0.5; transition: 0.3s; width: 28px; height: 20px; object-fit: cover; border-radius: 3px; }
        .flag-btn.active { opacity: 1; transform: scale(1.2); border: 2px solid #0ea5e9; }
        .surf-badge { background: #f59e0b; color: white; padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: bold; margin-left: 8px; vertical-align: middle; }
        
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0ea5e9; z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .splash-logo { width: 120px; height: 120px; margin-bottom: 20px; border-radius: 20px; }
        .loader {
            width: 30px; height: 30px; border: 3px solid #FFF;
            border-bottom-color: transparent; border-radius: 50%;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .beach-item { transition: transform 0.2s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-10 font-sans text-slate-900">

    <div id="splash">
        <img src="icono.png" alt="Logo" class="splash-logo">
        <div class="loader mb-4"></div>
        <p class="text-sky-50 text-xs animate-pulse tracking-widest uppercase">Escaneando Península...</p>
    </div>

    <header class="bg-white p-4 shadow-sm sticky top-0 z-50 flex justify-between items-center text-slate-900">
        <div class="flex items-center gap-2">
            <img src="icono.png" alt="Logo" class="w-8 h-8 rounded-md">
            <h1 class="text-xl font-bold text-sky-700 italic tracking-tighter uppercase">PraiaIdeal</h1>
        </div>
        <div class="flex space-x-3">
            <img src="https://flagcdn.com/w40/es.png" class="flag-btn active" id="btn-es" onclick="cambiarIdioma('es')">
            <img src="https://flagcdn.com/w40/br.png" class="flag-btn" id="btn-pt" onclick="cambiarIdioma('pt')">
            <img src="https://flagcdn.com/w40/us.png" class="flag-btn" id="btn-en" onclick="cambiarIdioma('en')">
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <section id="main-card" class="bg-gradient-ok rounded-[2.5rem] p-6 text-white shadow-xl relative min-h-[400px]">
            <div class="flex justify-between items-start">
                <div>
                    <span id="label-estado" class="text-[10px] bg-white/20 px-2 py-1 rounded-full uppercase tracking-widest font-bold" data-key="rec">RECOMENDADA HOY</span>
                    <h2 class="text-3xl font-black mt-2 uppercase italic leading-none">
                        <span id="view-nombre">---</span>
                        <span id="surf-tag" class="surf-badge hidden">SURF</span>
                    </h2>
                </div>
                <div id="view-clima-icon" class="text-4xl text-white">
                    <i class="fa-solid fa-sun text-yellow-300"></i>
                </div>
            </div>

            <div class="mt-4 flex justify-between items-end">
                <div class="flex items-baseline gap-2">
                    <span id="view-temp-aire" class="text-5xl font-black">--°</span>
                    <div class="flex flex-col">
                        <span class="text-[10px] opacity-70 uppercase font-bold" data-key="st">SENSACIÓN</span>
                        <span id="view-st" class="font-bold text-sm">--°</span>
                    </div>
                </div>
                <div class="text-right text-[11px] font-bold bg-black/10 p-2 rounded-xl space-y-1 text-white">
                    <p class="flex items-center justify-end gap-2"><span id="view-sunrise">--:--</span> <i class="fa-solid fa-sun text-yellow-300"></i></p>
                    <p class="flex items-center justify-end gap-2"><span id="view-sunset">--:--</span> <i class="fa-solid fa-moon text-sky-200"></i></p>
                </div>
            </div>

            <div id="alerta-arena" class="mt-4 bg-white/20 rounded-xl p-3 flex items-center gap-3 hidden border border-white/30">
                <i id="icon-arena" class="text-xl text-white"></i>
                <p id="msg-arena" class="text-xs font-bold leading-tight"></p>
            </div>

            <p id="view-mensaje" class="mt-4 text-sky-800 text-sm leading-tight italic min-h-[40px] bg-white/90 p-3 rounded-2xl shadow-inner"></p>

            <div id="data-grid" class="mt-6 grid grid-cols-2 gap-y-4 gap-x-2 border-t border-white/20 pt-4 text-white text-center">
                <div class="border-r border-white/10">
                    <p id="view-temp-agua" class="font-bold text-lg">--°</p>
                    <p class="text-[9px] uppercase opacity-70 font-bold" data-key="agua">AGUA</p>
                </div>
                <div>
                    <p class="font-bold text-lg leading-none"><span id="view-marea">--</span>m</p>
                    <p id="view-marea-desc" class="text-[8px] font-black uppercase tracking-tighter">--</p>
                    <p class="text-[9px] uppercase opacity-70 font-bold" data-key="marea">MAREA</p>
                </div>
                <div id="container-viento" class="border-t border-white/10 pt-2 border-r border-white/10">
                    <p id="view-viento" class="font-bold text-lg">--</p>
                    <p class="text-[9px] uppercase opacity-70 font-bold" data-key="viento">VIENTO</p>
                </div>
                <div id="container-olas" class="border-t border-white/10 pt-2">
                    <p id="view-olas" class="font-bold text-lg">--</p>
                    <p class="text-[9px] uppercase opacity-70 font-bold" data-key="olas">OLAS</p>
                </div>
            </div>

            <div class="mt-6">
                <a id="btn-maps" target="_blank" href="#" class="w-full bg-white text-sky-700 py-4 rounded-full font-black text-sm shadow-lg flex items-center justify-center active:scale-95 transition-transform">
                    <i class="fa-solid fa-location-dot mr-2"></i> <span data-key="ir">CÓMO LLEGAR</span>
                </a>
            </div>
        </section>

        <div class="relative text-slate-900">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
            <input type="text" id="buscador" onkeyup="filtrarPlayas()" placeholder="Buscar playa..." class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-sky-500 bg-white">
        </div>

        <section id="lista-playas" class="grid grid-cols-1 gap-3"></section>

        <div class="mt-10 p-8 bg-white rounded-[2.5rem] shadow-sm text-center border border-slate-100">
            <div class="w-12 h-12 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-coffee text-xl"></i>
            </div>
            <p id="colab-txt-main" class="text-sm font-bold text-slate-800 px-4 leading-tight"></p>
            <p id="colab-txt-sub" class="text-[11px] text-slate-400 mt-2 mb-6"></p>
            
            <button onclick="copiarPix()" id="btn-pix" class="w-full bg-emerald-500 text-white py-4 rounded-2xl font-black text-sm shadow-md active:scale-95 transition-all flex items-center justify-center gap-3">
                <i class="fa-solid fa-copy"></i> <span id="btn-pix-text">COPIAR CHAVE PIX</span>
            </button>
            
            <p class="text-[9px] text-slate-300 mt-4 uppercase tracking-widest font-bold">Titular: Damian Leonardo Gimenez</p>
        </div>

    </main>

    <script>
        const i18n = {
            es: { agua: "AGUA", viento: "VIENTO", marea: "MAREA", ir: "CÓMO LLEGAR", buscar: "Buscar playa...", rec: "RECOMENDADA HOY", info: "INFORMACIÓN LOCAL", todas: "TODAS LAS PLAYAS", olas: "OLAS", st: "SENSACIÓN", arenaOk: "¡Hay playa! Marea baja.", arenaNo: "⚠️ Poca arena por marea alta.", colabMain: "¿Te serví hoy? Invitame un café para que la app siga online.", colabSub: "Copiá la llave PIX y pegala en tu App de Banco o Mercado Pago.", colabBtn: "COPIAR LLAVE PIX", copiado: "¡LLAVE COPIADA!" },
            pt: { agua: "ÁGUA", viento: "VENTO", marea: "MARÉ", ir: "COMO CHEGAR", buscar: "Buscar praia...", rec: "RECOMENDADA HOJE", info: "INFORMAÇÃO LOCAL", todas: "TODAS AS PRAIAS", olas: "ONDAS", st: "SENSACAO", arenaOk: "Tem praia! Maré baixa.", arenaNo: "⚠️ Pouca areia por maré alta.", colabMain: "Gostou da dica de hoje? Ajude a manter o app online com um cafezinho.", colabSub: "Copie a chave PIX e cole no app do seu banco.", colabBtn: "COPIAR CHAVE PIX", copiado: "CHAVE COPIADA!" },
            en: { agua: "WATER", viento: "WIND", marea: "TIDE", ir: "GET DIRECTIONS", buscar: "Search beach...", rec: "RECOMMENDED TODAY", info: "LOCAL INFO", todas: "ALL BEACHES", olas: "WAVES", st: "FEELS LIKE", arenaOk: "Enjoy! Low tide.", arenaNo: "⚠️ Limited beach area.", colabMain: "Did I help you today? Support the app by buying me a coffee.", colabSub: "Copy the PIX key and paste it into your banking app.", colabBtn: "COPY PIX KEY", copiado: "KEY COPIED!" }
        };

        const playas = [
            { id: 0, nombre: "Geribá", lat: -22.7753, lon: -41.9056, prot: [250, 320], surf: true, face: 'S', critica: false, es: "La meca del surf. Ambiente joven y olas constantes.", pt: "A meca do surf. Clima jovem e ondas constantes.", en: "The surf mecca. Young vibes and constant waves." },
            { id: 1, nombre: "João Fernandes", lat: -22.7422, lon: -41.8764, prot: [110, 250], surf: false, face: 'N', critica: true, es: "Ideal con viento Sur. Aguas cristalinas para snorkel.", pt: "Ideal com vento Sul. Águas cristalinas para snorkel.", en: "Perfect with South wind. Crystal water for snorkeling." },
            { id: 2, nombre: "Ferradura", lat: -22.7678, lon: -41.8881, prot: [0, 110], surf: false, face: 'S', critica: false, es: "Piscina natural. Ideal con viento Norte para familias.", pt: "Piscina natural. Ideal com vento Norte para famílias.", en: "Natural pool. Best with North wind for families." },
            { id: 3, nombre: "Tartaruga", lat: -22.7561, lon: -41.8972, prot: [110, 250], surf: false, face: 'N', critica: true, es: "Agua cálida, mar calmo y atardeceres únicos.", pt: "Água quente, mar calmo e pôr do sol único.", en: "Warm water, calm sea and unique sunsets." },
            { id: 4, nombre: "Brava", lat: -22.7610, lon: -41.8720, prot: [220, 310], surf: false, face: 'S', critica: true, es: "Paisaje salvaje y sofisticado. Excelentes paradores.", pt: "Paisagem selvagem e sofisticada. Excelentes paradores.", en: "Wild and sophisticated landscape. Great beach clubs." },
            { id: 5, nombre: "Azeda", lat: -22.7461, lon: -41.8805, prot: [130, 260], surf: false, face: 'N', critica: true, es: "Pequeñas y paradisíacas. Muy tranquilas.", pt: "Pequenas e paradisíacas. Muito tranquilas.", en: "Small and paradisiacal. Very calm." },
            { id: 6, nombre: "Azedinha", lat: -22.7455, lon: -41.8795, prot: [130, 260], surf: false, face: 'N', critica: true, es: "Vecina de Azeda, aún más íntima y pequeña.", pt: "Vizinha da Azeda, ainda mais íntima e pequena.", en: "Neighbor to Azeda, even more intimate and small." },
            { id: 7, nombre: "Forno", lat: -22.7570, lon: -41.8740, prot: [0, 90], surf: false, face: 'N', critica: true, es: "Arena roja y agua muy mansa.", pt: "Areia vermelha e água muito mansa.", en: "Red sand and very calm water." },
            { id: 8, nombre: "Tucuns", lat: -22.7950, lon: -41.9330, prot: [180, 270], surf: true, face: 'S', critica: false, es: "Extensa y virgen. Muy buena para surf.", pt: "Extensa e virgem. Muito boa para o surf.", en: "Extensive and virgin. Very good for surfing." },
            { id: 9, nombre: "Manguinhos", lat: -22.7650, lon: -41.9180, prot: [0, 120], surf: false, face: 'N', critica: false, es: "Ideal para caminar y ver el atardecer.", pt: "Ideal para caminhar e ver o pôr do sol.", en: "Great for walking and sunsets." },
            { id: 10, nombre: "Ossos", lat: -22.7480, lon: -41.8830, prot: [110, 250], surf: false, face: 'N', critica: true, es: "Histórica y pintoresca, con barcos de pescadores.", pt: "Histórica e pitoresca, com barcos de pescadores.", en: "Historic and picturesque, with fishing boats." },
            { id: 11, nombre: "Praia do Canto", lat: -22.7535, lon: -41.8875, prot: [110, 250], surf: false, face: 'N', critica: true, es: "En el centro de la ciudad, mar muy calmo.", pt: "No centro da cidade, mar muito calmo.", en: "In the city center, very calm sea." },
            { id: 12, nombre: "João Fernandinho", lat: -22.7410, lon: -41.8750, prot: [110, 250], surf: false, face: 'N', critica: true, es: "Pequeña y exclusiva, vecina de João Fernandes.", pt: "Pequena e exclusiva, vizinha de João Fernandes.", en: "Small and exclusive, neighbor to João Fernandes." },
            { id: 13, nombre: "Ferradurinha", lat: -22.7777, lon: -41.8988, prot: [0, 110], surf: false, face: 'S', critica: true, es: "Escondida y mansa. Ideal para kayak y SUP.", pt: "Escondida e mansa. Ideal para caiaque e SUP.", en: "Hidden and calm. Great for kayak and SUP." },
            { id: 14, nombre: "Caravelas", lat: -22.8130, lon: -41.9460, prot: [180, 270], surf: true, face: 'S', critica: false, es: "Playa de mar abierto, excelente para surf.", pt: "Praia de mar aberto, excelente para surf.", en: "Open sea beach, excellent for surfing." },
            { id: 15, nombre: "José Gonçalves", lat: -22.7880, lon: -41.9420, prot: [180, 270], surf: true, face: 'S', critica: true, es: "Rodeada de reserva natural. Muy salvaje.", pt: "Cercada por reserva natural. Muito selvagem.", en: "Surrounded by a nature reserve. Very wild." }
        ];

        let datosGlobales = { dir: 0, vel: 0, lang: 'es' };
        let playaActual = null;
        const CHAVE_PIX = "19431fa4-da2e-4709-97fd-ffdcf09cf664";

        async function cargarApp() {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=-22.76&longitude=-41.88&daily=sunrise,sunset&hourly=windspeed_10m,winddirection_10m&timezone=auto`);
                const data = await res.json();
                const h = new Date().getHours();
                datosGlobales.dir = data.hourly.winddirection_10m[h];
                datosGlobales.vel = data.hourly.windspeed_10m[h];
                document.getElementById('view-sunrise').innerText = data.daily.sunrise[0].split('T')[1];
                document.getElementById('view-sunset').innerText = data.daily.sunset[0].split('T')[1];
                seleccionarPlaya(playas.find(p => p.nombre === "Geribá") || playas[0]); 
                cambiarIdioma('es');
                setTimeout(() => { document.getElementById('splash').style.display = 'none'; }, 1000);
            } catch (e) { console.error(e); }
        }

        async function seleccionarPlaya(playa) {
            playaActual = playa;
            document.getElementById('view-nombre').innerText = playa.nombre;
            document.getElementById('surf-tag').className = playa.surf ? "surf-badge" : "hidden";
            document.getElementById('view-mensaje').innerText = playa[datosGlobales.lang] || '';

            try {
                const [rM, rW] = await Promise.all([
                    fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${playa.lat}&longitude=${playa.lon}&hourly=sea_surface_temperature,wave_height`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${playa.lat}&longitude=${playa.lon}&hourly=temperature_2m,apparent_temperature,weather_code,windspeed_10m&forecast_days=1`)
                ]);
                const dM = await rM.json(); const dW = await rW.json();
                const h = new Date().getHours();
                
                const valMarea = (Math.sin((new Date().getTime() / 22350000) * 2 * Math.PI) + 0.7).toFixed(1);
                document.getElementById('view-marea').innerText = valMarea;
                document.getElementById('view-marea-desc').innerText = valMarea > 0.9 ? "ALTA" : "BAJA";
                
                document.getElementById('view-temp-aire').innerText = `${Math.round(dW.hourly.temperature_2m[h])}°`;
                document.getElementById('view-st').innerText = `${Math.round(dW.hourly.apparent_temperature[h])}°`;
                document.getElementById('view-temp-agua').innerText = `${dM.hourly.sea_surface_temperature[h]}°`;
                document.getElementById('view-viento').innerText = `${dW.hourly.windspeed_10m[h]} km/h`;
                document.getElementById('view-olas').innerText = `${dM.hourly.wave_height[h]} m`;

                const playsSurf = ["Tucuns", "Geribá", "Caravelas", "José Gonçalves"];
                if (playsSurf.includes(playa.nombre)) {
                    document.getElementById('container-viento').className = "border-t border-white/10 pt-2 border-r border-white/10 col-span-1";
                    document.getElementById('container-olas').classList.remove('hidden');
                } else {
                    document.getElementById('container-viento').className = "border-t border-white/10 pt-2 col-span-2";
                    document.getElementById('container-olas').classList.add('hidden');
                }

                const card = document.getElementById('main-card');
                const alerta = document.getElementById('alerta-arena');
                const mareaMala = playa.critica && valMarea > 0.9;
                const vientoMalo = dW.hourly.windspeed_10m[h] >= 8 && !(dW.hourly.winddirection_10m[h] >= playa.prot[0] && dW.hourly.winddirection_10m[h] <= playa.prot[1]);

                if (mareaMala || vientoMalo) {
                    card.className = "bg-gradient-warning rounded-[2.5rem] p-6 text-white shadow-xl relative min-h-[400px]";
                    if (mareaMala) {
                        alerta.classList.remove('hidden');
                        document.getElementById('msg-arena').innerText = i18n[datosGlobales.lang].arenaNo;
                        document.getElementById('icon-arena').className = "fa-solid fa-cloud-showers-water";
                    } else { alerta.classList.add('hidden'); }
                } else {
                    card.className = "bg-gradient-ok rounded-[2.5rem] p-6 text-white shadow-xl relative min-h-[400px]";
                    if (playa.critica) {
                        alerta.classList.remove('hidden');
                        document.getElementById('msg-arena').innerText = i18n[datosGlobales.lang].arenaOk;
                        document.getElementById('icon-arena').className = "fa-solid fa-umbrella-beach";
                    } else { alerta.classList.add('hidden'); }
                }
                document.getElementById('btn-maps').href = `https://www.google.com/maps/search/?api=1&query=Praia+de+${playa.nombre}+Buzios`;
            } catch (e) { console.error(e); }
        }

        function cambiarIdioma(lang) {
            datosGlobales.lang = lang;
            document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${lang}`).classList.add('active');
            document.querySelectorAll('[data-key]').forEach(el => el.innerText = i18n[lang][el.getAttribute('data-key')]);
            
            // Textos colab
            document.getElementById('colab-txt-main').innerText = i18n[lang].colabMain;
            document.getElementById('colab-txt-sub').innerText = i18n[lang].colabSub;
            document.getElementById('btn-pix-text').innerText = i18n[lang].colabBtn;

            if(playaActual) document.getElementById('view-mensaje').innerText = playaActual[lang] || '';
            renderizarLista();
        }

        function copiarPix() {
            navigator.clipboard.writeText(CHAVE_PIX);
            const btnText = document.getElementById('btn-pix-text');
            const originalText = btnText.innerText;
            btnText.innerText = i18n[datosGlobales.lang].copiado;
            document.getElementById('btn-pix').classList.replace('bg-emerald-500', 'bg-emerald-700');
            setTimeout(() => {
                btnText.innerText = originalText;
                document.getElementById('btn-pix').classList.replace('bg-emerald-700', 'bg-emerald-500');
            }, 2000);
        }

        function filtrarPlayas() { renderizarLista(); }

        function renderizarLista() {
            const container = document.getElementById('lista-playas');
            container.innerHTML = "";
            const filtro = document.getElementById('buscador').value.toLowerCase();
            const lista = playas.filter(p => p.nombre.toLowerCase().includes(filtro));
            lista.forEach(p => {
                const ok = datosGlobales.vel < 8 || (datosGlobales.dir >= p.prot[0] && datosGlobales.dir <= p.prot[1]);
                const div = document.createElement('div');
                div.className = `beach-item bg-white p-4 rounded-2xl shadow-sm flex justify-between items-center cursor-pointer mb-2 border-l-4 ${ok ? 'border-emerald-400' : 'border-slate-200'}`;
                div.onclick = () => { seleccionarPlaya(p); window.scrollTo({ top: 0, behavior: 'smooth' }); };
                div.innerHTML = `<div class="flex flex-col"><span class="font-bold text-slate-700">${p.nombre}</span><p class="text-[10px] text-slate-400 mt-1">${p[datosGlobales.lang] || ''}</p></div><i class="fa-solid fa-chevron-right text-slate-300"></i>`;
                container.appendChild(div);
            });
        }
        cargarApp();
    </script>
</body>
</html>
