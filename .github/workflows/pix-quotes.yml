name: Update PIX quotes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pix-quotes.yml'
      - 'scripts/update_pix.py'
      - 'scripts/update_tides.py'
      - 'index.html'
      - 'portal.js'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pix-quotes
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch documented public API
        run: python scripts/update_pix.py
      - name: Refresh tide tables daily
        continue-on-error: true
        run: python scripts/update_tides.py
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pix-quotes.json tide-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update PIX quote snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
